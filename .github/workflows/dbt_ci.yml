name: dbt CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  run_dbt:
    runs-on: ubuntu-latest

    # Pull secure keys from GitHub Secrets and map them to environment variables
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution by caching pip packages

      - name: Install dbt and Snowflake connector
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Install dbt dependencies
        run: dbt deps

      # INDUSTRY STANDARD: Test against dev/sandbox on feature branches and PRs
      - name: Run dbt Build (Pull Request & Dev)
        if: github.ref != 'refs/heads/main'
        run: |
          dbt build --target dev

      # INDUSTRY STANDARD: Deploy to production only when code hits main
      - name: Run dbt Build (Production - Main Branch)
        if: github.ref == 'refs/heads/main'
        run: |
          dbt build --target prod